<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Inbox · Project mail</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inbox">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <div id="storage-notice" class="storage-notice" role="alert" hidden></div>
  <div id="app"><div class="loading"><span class="loading-mark">✉</span><p>Opening your workspace…</p></div></div>
  <dialog id="compose-dialog" class="compose-dialog" aria-labelledby="compose-title"></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="alias-dialog" class="small-dialog" aria-labelledby="alias-title"></dialog>
  <dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-title"></dialog>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
